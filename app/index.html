<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rowan Video Test</title><style>body{background:#101820;color:white;font:24px Arial,sans-serif;margin:35px}h1{color:#79dfd2}button,input{font:22px Arial;padding:12px;margin:6px}button:focus,input:focus{outline:5px solid #79dfd2}input{width:70%}video{width:90%;height:55vh;background:black}#status{font-size:20px;color:#a4d6ee}</style></head><body><h1>Rowan Video Test · Tizen 3</h1><p>Проверка запуска модуля и HTML5-видео</p><p id="status">Приложение запущено.</p><video id="v" controls preload="none"></video><p><button id="sample">Проверить тестовое видео</button><button id="play">▶ / ❚❚</button></p><p><input id="url" placeholder="Прямая ссылка на MP4 или HLS"><button id="open">Открыть</button></p><p style="font-size:16px">Диагностическая версия: ссылки youtube.com/watch не воспроизводятся.</p><script>(function(){var v=document.getElementById('v'),s=document.getElementById('status');function status(t){s.textContent=t}function load(url){v.src=url;v.load();status('Загрузка видео…');var p=v.play();if(p&&p.catch)p.catch(function(e){status('Ошибка запуска: '+e.message)})}document.getElementById('sample').onclick=function(){load('https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4')};document.getElementById('open').onclick=function(){load(document.getElementById('url').value)};document.getElementById('play').onclick=function(){if(v.paused)v.play();else v.pause()};v.onerror=function(){status('Ошибка видео (код '+(v.error?v.error.code:'?')+')')};v.onplaying=function(){status('Видео воспроизводится')};document.onkeydown=function(e){if(e.keyCode===13&&document.activeElement===document.body)document.getElementById('sample').focus();if(e.keyCode===10009&&history.length>1)history.back()}})();</script></body></html>
