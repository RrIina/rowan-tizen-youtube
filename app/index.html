<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Rowan Loader</title><style>body{background:#101b28;color:white;font:26px Arial;padding:35px}button{font:24px Arial;padding:14px}</style></head><body><h2>Rowan Player</h2><p id="status">Загружаю последнюю версию…</p><button onclick="location.reload()">Повторить</button><script>
(function(){var s=document.getElementById('status');var xhr=new XMLHttpRequest();xhr.open('GET','https://raw.githubusercontent.com/RrIina/rowan-tizen-youtube/main/app/player.html?ts='+new Date().getTime(),true);xhr.timeout=12000;xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status===200&&xhr.responseText.indexOf('<html')!==-1){document.open();document.write(xhr.responseText);document.close()}else{s.textContent='Не удалось загрузить обновление (HTTP '+xhr.status+'). Проверь интернет.'}}};xhr.ontimeout=function(){s.textContent='Превышено время загрузки'};xhr.onerror=function(){s.textContent='Ошибка сети или ограничение доступа к GitHub'};xhr.send(null)})();
</script></body></html>
